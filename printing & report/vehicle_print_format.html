<div class="container">

    <div class="row">
        <div class="col-sm-12">
            <h2 class="text-left">
                Vehicle Details
            </h2>

            <hr>
        </div>
    </div>

    <div class="row">
        <div class="col-sm-12">

            <table class="table table-bordered table-striped">
                <tr>
                    <th>Vehicle Number</th>
                    <td>{{ doc.vehicle_number }}</td>
                </tr>

                <tr>
                    <th>Vehicle Type</th>
                    <td>{{ doc.vehicle_type }}</td>
                </tr>

                <tr>
                    <th>Make</th>
                    <td>{{ doc.make }}</td>
                </tr>

                <tr>
                    <th>Model</th>
                    <td>{{ doc.model }}</td>
                </tr>
            </table>

        </div>

        <div class="col-sm-12">

            <table class="table table-bordered table-striped">
                <tr>
                    <th>Purchase Date</th>
                    <td>{{ doc.purchase_date }}</td>
                </tr>

                <tr>
                    <th>Driver</th>
                    <td>{{ doc.driver }}</td>
                </tr>

                <tr>
                    <th>Current Odometer</th>
                    <td>{{ doc.current_odometer }}</td>
                </tr>

                <tr>
                    <th>Status</th>
                    <td>{{ doc.status }}</td>
                </tr>
            </table>

        </div>
    </div>

    <div class="row">
        <div class="col-sm-12">
            <p class="text-left">
                Vehicle Management System
            </p>
        </div>
    </div>

</div>
